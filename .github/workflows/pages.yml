name: pages (wizard demo)

# examples/wizard を GitHub Pages に公開する。
# endpoint は Repository Variable WIZARD_ENDPOINT から config.js に注入する
# （未設定なら送信先なし＝UI のみ）。秘密情報は不要（送信系はトークン認証を使わない）。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "examples/wizard/**"
      - "sdk/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: sdk/pnpm-lock.yaml

      - name: Build SDK
        working-directory: sdk
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Assemble wizard site
        working-directory: examples/wizard
        run: |
          cp ../../sdk/dist/index.js sdk.js
          echo "window.FRONTPING_ENDPOINT = ${{ toJSON(vars.WIZARD_ENDPOINT) }};" > config.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: examples/wizard

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
