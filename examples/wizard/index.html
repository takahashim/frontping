<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>コーヒー診断 — frontping demo</title>
<style>
  :root { color-scheme: light dark; --bg:#f6f7f9; --bot:#fff; --me:#2563eb; --line:#e3e6ea; }
  * { box-sizing: border-box; }
  body { font: 15px/1.6 system-ui, sans-serif; margin: 0; background: var(--bg); }
  .app { max-width: 560px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
  header { padding: 14px 18px; background: #111827; color: #fff; position: sticky; top: 0; }
  header h1 { font-size: 16px; margin: 0; }
  header small { color: #9ca3af; }
  .thread { flex: 1; padding: 18px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; }
  .bot { background: var(--bot); border: 1px solid var(--line); align-self: flex-start; border-bottom-left-radius: 4px; }
  .me { background: var(--me); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
  .result { align-self: stretch; background: #ecfdf5; border: 1px solid #a7f3d0; border-radius: 14px; padding: 14px; }
  .result h3 { margin: 0 0 4px; }
  .choices { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 18px 16px; }
  button { font: inherit; padding: 9px 14px; border: 1px solid var(--line); border-radius: 999px; background: #fff; cursor: pointer; }
  button:hover { border-color: #9ca3af; }
  button.primary { background: var(--me); color: #fff; border-color: var(--me); }
  button.ghost { background: transparent; }
  footer { padding: 10px 18px 18px; display: flex; gap: 8px; justify-content: space-between; align-items: center; }
  footer small { color: #6b7280; }
  .err { color: #b91c1c; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>☕ コーヒー診断ボット</h1>
    <small>いくつか質問に答えると、あなたにぴったりの一杯を提案します</small>
  </header>
  <div class="thread" id="thread"></div>
  <div class="choices" id="choices"></div>
  <footer>
    <small id="status">frontping: <span id="fp">送信待ち</span></small>
    <button class="ghost" id="errbtn" title="エラーイベントを frontping に送るデモ">デモエラーを送信</button>
  </footer>
</div>
<!-- endpoint 注入（ローカルは serve.mjs が、Pages は CI が生成。無ければ UI のみ） -->
<script src="./config.js"></script>
<!-- SDK を相対パスで解決（GitHub Pages のサブパス配信でも壊れない） -->
<script type="importmap">
  { "imports": { "@frontping/sdk": "./sdk.js" } }
</script>
<script type="module" src="./app.js"></script>
</body>
</html>
